<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Coding Club events and registration">
    <title>Coding Club</title>
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="#home">Home</a> |
        <a href="#events">Events</a> |
        <a href="#register">Register</a>
    </nav>

    <!-- Main Heading -->
    <header id="home">
        <h1>Coding Club</h1>
        <p>Learn. Build. Share.</p>
    </header>

    <hr>

    <!-- Events Table -->
    <section id="events">
        <h2>Upcoming Events</h2>

        <table border="1">
            <caption>Club Events</caption>

            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>
            <body>
                <tr>
                    <td>HTML Workshop</td>
                    <td>12 November</td>
                    <td>Lab 1</td>
                </tr>

                <tr>
                    <td>Hackathon</td>
                    <td>20 November</td>
                    <td>Seminar Hall</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3">Total Events: 2</td>
                </tr>
            </tfoot>
        </table>
    </section>

    <hr>

    <!-- Registration Form -->
    <section id="register">
        <h2>Student Registration</h2>

        <form action="#" method="get">

            <p>
                <label for="name">Name:</label>
                <input type="text" id="name"
                       name="name" placeholder="Your name" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email"
                       name="email" placeholder="you@example.com" required>
            </p>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password"
                       name="password" required>
            </p>

            <p>
                <label for="dob">26/08/2007:</label>
                <input type="date" id="dob" name="dob" value="2007-08-26">
            </p>

            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </p>

            <p>Gender:
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </p>

            <p>Interests:
                <input type="checkbox" id="html" name="interest" value="HTML">
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="interest" value="CSS">
                <label for="css">CSS</label>
            </p>

            <p>
                <label for="branch">Branch:</label>
                <select id="branch" name="branch">
                    <option value="BTech CSE-AI">BTech CSE-AI</option>
                    <option value="BCA">BCA</option>
                    <option value="Other">Other</option>
                </select>
            </p>

            <p>
                <label for="message">Why do you want to join?</label><br>
                <textarea id="message" name="message"
                          rows="4" cols="30"></textarea>
            </p>

            <button type="submit">Register</button>
        </form>
    </section>

    <hr>

    <footer>
        <p>Created by Kunal Kumar</p>
    </footer>

</body>
</html>
